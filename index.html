<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>2048+</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;--accent:#e94560;--text:#eaeaea;--text-dim:#888;--radius:8px;--gap:8px}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:12px}
#app{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px}
.header{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.header-title{font-size:2rem;font-weight:900;color:#fff}
.header-title .plus{color:var(--accent)}
.coins-display{display:flex;align-items:center;gap:6px;background:var(--surface2);padding:6px 14px;border-radius:20px;font-size:1.1rem;font-weight:700}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
.metric{background:var(--surface);border-radius:var(--radius);padding:8px 4px;text-align:center}
.metric-label{font-size:0.65rem;color:var(--text-dim);text-transform:uppercase}
.metric-value{font-size:1rem;font-weight:700;margin-top:2px}
.actions{display:flex;gap:var(--gap);flex-wrap:wrap}
.btn-action{flex:1;min-width:70px;background:var(--surface2);color:var(--text);border:none;border-radius:var(--radius);padding:8px 4px;font-size:0.78rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;transition:background 0.15s}
.btn-action:hover{background:#1a4a7a}
.btn-action .cost{font-size:0.65rem;color:#ffd700}
.btn-action.btn-new{background:var(--accent)}
.btn-action.btn-new:hover{background:#c73652}
.btn-action.charged{background:#2a6a2a}
.btn-action .badge{position:absolute;top:4px;right:4px;background:#ffd700;color:#000;border-radius:50%;width:16px;height:16px;font-size:0.65rem;display:flex;align-items:center;justify-content:center;font-weight:700}
.hidden{display:none!important}
.board-wrapper{position:relative;width:100%}
.board{display:grid;gap:var(--gap);background:#0a0a1a;border-radius:var(--radius);padding:var(--gap);width:100%;aspect-ratio:1}
.board-4{grid-template-columns:repeat(4,1fr)}
.board-5{grid-template-columns:repeat(5,1fr)}
.board-6{grid-template-columns:repeat(6,1fr)}
.tile{border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(0.7rem,3vw,1.4rem);aspect-ratio:1;cursor:default;transition:transform 0.1s;user-select:none;position:relative;z-index:1}
.tile-empty{background:#1e1e3a}
.tile-2{background:#6b3fa0;color:#fff}
.tile-4{background:#8b5fc0;color:#fff}
.tile-8{background:#2e7d32;color:#fff}
.tile-16{background:#43a047;color:#fff}
.tile-32{background:#e65100;color:#fff}
.tile-64{background:#ef9a9a;color:#333}
.tile-128{background:#ffd700;color:#333}
.tile-256{background:#c8a000;color:#fff}
.tile-512{background:#1565c0;color:#fff}
.tile-1024{background:#0d47a1;color:#fff;font-size:clamp(0.55rem,2.5vw,1.1rem)}
.tile-2048{background:#4a148c;color:#fff;font-size:clamp(0.55rem,2.5vw,1.1rem)}
.tile-4096,.tile-8192,.tile-16384,.tile-32768,.tile-65536,.tile-131072{background:#1a0030;color:#e040fb;font-size:clamp(0.45rem,2vw,0.9rem)}
.tile.deletable{outline:2px dashed var(--accent);cursor:pointer;animation:pulse-border 1s infinite}
@keyframes pulse-border{0%,100%{outline-color:var(--accent)}50%{outline-color:#ffd700}}
.board.delete-active .tile:not(.tile-empty){position:relative;z-index:11;cursor:pointer}
.death-select-active .tile:not(.tile-empty){position:relative;z-index:11;cursor:pointer}
.overlay{position:absolute;inset:0;background:rgba(10,10,26,0.92);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;z-index:10}
.overlay-content{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px;text-align:center}
.overlay-title{font-size:1.6rem;font-weight:900;color:var(--accent)}
.btn-overlay{width:100%;padding:12px;border:none;border-radius:var(--radius);background:var(--surface2);color:var(--text);font-size:0.95rem;cursor:pointer;transition:background 0.15s}
.btn-overlay:hover:not(:disabled){background:#1a4a7a}
.btn-overlay:disabled{opacity:0.4;cursor:not-allowed}
.btn-overlay.btn-newgame{background:var(--accent)}
.btn-overlay.btn-heart{background:#6a1a3a}
.overlay-delete{position:absolute;inset:0;z-index:10;background:rgba(10,10,26,0.6);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px;gap:10px;pointer-events:none}
.delete-banner{font-size:0.95rem;font-weight:700;color:#fff;text-align:center;background:rgba(233,69,96,0.9);padding:8px 16px;border-radius:6px;pointer-events:none}
.btn-cancel{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:10px 28px;border-radius:6px;cursor:pointer;font-size:0.9rem;font-weight:600;pointer-events:all}
.btn-cancel:hover{background:rgba(255,255,255,0.25)}
.overlay-death{position:absolute;inset:0;z-index:8;pointer-events:none}
.death-banner{position:absolute;top:0;left:0;right:0;background:rgba(233,69,96,0.9);padding:8px 12px;text-align:center;font-weight:700;border-radius:var(--radius) var(--radius) 0 0;pointer-events:all}
.death-counter{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-weight:700;font-size:1.1rem;pointer-events:none}
.btn-cancel-death{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.15);border:none;color:#fff;padding:6px 20px;border-radius:4px;cursor:pointer;pointer-events:all}
.tabs{display:flex;gap:var(--gap);background:var(--surface);border-radius:var(--radius);padding:4px}
.tab{flex:1;padding:8px 4px;border:none;background:transparent;color:var(--text-dim);border-radius:6px;cursor:pointer;font-size:0.8rem;transition:all 0.15s}
.tab.active{background:var(--surface2);color:var(--text);font-weight:700}
.tab-content{padding:4px 0}
.shop{display:flex;flex-direction:column;gap:12px}
.section-title{font-size:0.85rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em;margin-top:8px}
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap)}
.shop-item{background:var(--surface);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.shop-coins{font-size:1.1rem;font-weight:700;color:#ffd700}
.shop-label{font-size:0.75rem;color:var(--text-dim)}
.btn-buy{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:0.85rem}
.upgrades{display:flex;flex-direction:column;gap:8px}
.upgrade-item{background:var(--surface);border-radius:var(--radius);padding:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.upg-info{font-size:0.82rem;flex:1;line-height:1.4}
.upg-info b{color:#fff}
.btn-upg{background:var(--surface2);color:#ffd700;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:0.8rem;white-space:nowrap;flex-shrink:0}
.btn-upg:hover:not(.disabled){background:#1a4a7a}
.btn-upg.disabled{opacity:0.4;cursor:not-allowed;pointer-events:none}
.upg-done{color:#4caf50;font-size:0.85rem;white-space:nowrap}
.achievements{display:flex;flex-direction:column;gap:8px}
.ach-item{background:var(--surface);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;gap:10px}
.ach-tile{width:44px;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.75rem;flex-shrink:0}
.ach-label{flex:1;font-size:0.85rem}
.ach-status{font-size:0.8rem;color:var(--text-dim)}
.ach-item.collected .ach-status{color:#4caf50}
.btn-claim{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:0.85rem}
.btn-claim.pulse{animation:pulse-btn 1s infinite}
@keyframes pulse-btn{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#toast-container{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:100;pointer-events:none}
.toast{background:rgba(30,30,60,0.95);color:#fff;padding:10px 20px;border-radius:20px;font-size:0.9rem;opacity:0;transform:translateY(10px);transition:all 0.3s;white-space:nowrap}
.toast.show{opacity:1;transform:translateY(0)}
.achievement-popup{position:absolute;top:8px;left:8px;right:8px;background:rgba(233,69,96,0.95);color:#fff;padding:10px 14px;border-radius:var(--radius);font-size:0.85rem;font-weight:700;text-align:center;z-index:20;animation:slide-down 0.3s ease}
@keyframes slide-down{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(max-width:360px){.metrics{grid-template-columns:repeat(2,1fr)}.metric-value{font-size:0.85rem}}
@media(max-width:480px){
  body{padding:6px}
  .header-title{font-size:1.6rem}
  .coins-display{padding:5px 10px;font-size:0.95rem}
  .btn-action{font-size:0.72rem;padding:7px 3px}
  .tile{font-size:clamp(0.6rem,2.5vw,1.2rem)}
  .shop-grid{grid-template-columns:repeat(2,1fr)}
  .tab{font-size:0.72rem;padding:7px 2px}
  .overlay-content{padding:16px}
  .overlay-title{font-size:1.3rem}
  .btn-overlay{padding:10px;font-size:0.88rem}
}
.lb-wrap{display:flex;flex-direction:column;gap:10px}
.lb-toggle{display:flex;background:var(--surface);border-radius:var(--radius);padding:3px;gap:4px}
.lb-toggle-btn{flex:1;padding:7px 4px;border:none;background:transparent;color:var(--text-dim);border-radius:6px;cursor:pointer;font-size:0.8rem;transition:all 0.15s}
.lb-toggle-btn.active{background:var(--surface2);color:var(--text);font-weight:700}
.lb-my-rank{background:var(--surface);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.lb-my-rank-label{font-size:0.8rem;color:var(--text-dim)}
.lb-my-rank-val{font-size:1.1rem;font-weight:900;color:#ffd700}
.lb-table{display:flex;flex-direction:column;gap:4px}
.lb-row{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--radius);padding:10px 12px}
.lb-row.lb-me{background:#0f3460;border:1px solid #ffd700}
.lb-rank{width:28px;text-align:center;font-weight:900;font-size:0.9rem;color:var(--text-dim);flex-shrink:0}
.lb-rank.gold{color:#ffd700;font-size:1rem}
.lb-rank.silver{color:#c0c0c0;font-size:1rem}
.lb-rank.bronze{color:#cd7f32;font-size:1rem}
.lb-nick{flex:1;font-size:0.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-score{font-size:0.88rem;font-weight:700;color:#fff;white-space:nowrap}
.lb-tile{font-size:0.72rem;color:var(--text-dim);white-space:nowrap}
.lb-loading{text-align:center;color:var(--text-dim);padding:24px;font-size:0.9rem}
.lb-empty{text-align:center;color:var(--text-dim);padding:24px;font-size:0.85rem}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-container"></div>
<script src="near-connect.bundle.js"></script>
<script>

// =============================================
// UpgradeSystem
// =============================================
class UpgradeSystem {
  static SPAWN_COSTS=[800,1500,2800,4500,7000,10500,15000,22000];
  static COIN_BONUS_COSTS=[600,1400,2800];
  static COMBO_COSTS=[500,1000,2000,3500,5000,7000,9000,11000,12500,14000];
  static AUTO_DELETE_COSTS=[2000,4500,9000];
  constructor(k){this._k=k||(x=>x);this._load()}
  _load(){const r=localStorage.getItem(this._k('upgrades'));const d={spawnLevel:0,spawnUnlocked:false,coinBonusLevel:0,comboLevel:0,autoDeleteLevel:0,secondHeart:false,grid5:false,grid6:false};this._data=r?{...d,...JSON.parse(r)}:d}
  _save(){localStorage.setItem(this._k('upgrades'),JSON.stringify(this._data))}
  getSpawnLevel(){return this._data.spawnLevel}
  isSpawnUnlocked(){return this._data.spawnUnlocked}
  unlockSpawn(){this._data.spawnUnlocked=true;this._save()}
  getCoinBonusLevel(){return this._data.coinBonusLevel}
  getComboLevel(){return this._data.comboLevel}
  getAutoDeleteLevel(){return this._data.autoDeleteLevel}
  hasSecondHeart(){return this._data.secondHeart}
  hasGrid5(){return this._data.grid5}
  hasGrid6(){return this._data.grid6}
  getGridSize(){if(this._data.grid6)return 6;if(this._data.grid5)return 5;return 4}
  spawnUpgradeCost(){const l=this._data.spawnLevel;return l<8?UpgradeSystem.SPAWN_COSTS[l]:null}
  coinBonusUpgradeCost(){const l=this._data.coinBonusLevel;return l<3?UpgradeSystem.COIN_BONUS_COSTS[l]:null}
  comboUpgradeCost(){const l=this._data.comboLevel;return l<10?UpgradeSystem.COMBO_COSTS[l]:null}
  autoDeleteUpgradeCost(){const l=this._data.autoDeleteLevel;return l<3?UpgradeSystem.AUTO_DELETE_COSTS[l]:null}
  buySpawn(c){if(!this._data.spawnUnlocked)return false;const cost=this.spawnUpgradeCost();if(cost===null)return false;if(!c.spend(cost))return false;this._data.spawnLevel++;this._save();return true}
  buyCoinBonus(c){const cost=this.coinBonusUpgradeCost();if(cost===null)return false;if(!c.spend(cost))return false;this._data.coinBonusLevel++;this._save();return true}
  buyCombo(c){const cost=this.comboUpgradeCost();if(cost===null)return false;if(!c.spend(cost))return false;this._data.comboLevel++;this._save();return true}
  buyAutoDelete(c){const cost=this.autoDeleteUpgradeCost();if(cost===null)return false;if(!c.spend(cost))return false;this._data.autoDeleteLevel++;this._save();return true}
  buySecondHeart(c){if(this._data.secondHeart)return false;if(!c.spend(1800))return false;this._data.secondHeart=true;this._save();return true}
  buyGrid5(c){if(this._data.grid5)return false;if(!c.spend(10000))return false;this._data.grid5=true;this._save();return true}
  buyGrid6(c){if(!this._data.grid5)return false;if(this._data.grid6)return false;if(!c.spend(20000))return false;this._data.grid6=true;this._save();return true}
}

// =============================================
// CurrencyManager
// =============================================
class CurrencyManager {
  constructor(u,k){this.upgradeSystem=u;this._k=k||(x=>x);this._coins=parseInt(localStorage.getItem(this._k('coins'))||'0',10);this._listeners=[]}
  get coins(){return this._coins}
  onChange(fn){this._listeners.push(fn)}
  _notify(){localStorage.setItem(this._k('coins'),this._coins);this._listeners.forEach(fn=>fn(this._coins))}
  calcMergeCoins(v){if(v<16)return 0;return Math.min(8,Math.max(0,Math.floor(Math.log2(v)-3)))}
  awardMerge(v){let b=this.calcMergeCoins(v);if(b===0)return 0;if(v>=16){const bl=this.upgradeSystem.getCoinBonusLevel();b*=1+([0,0.05,0.10,0.15][bl]||0)}if(v>=128){b*=1+this.upgradeSystem.getComboLevel()*0.105}const e=Math.floor(b);this._coins+=e;this._notify();return e}
  add(a){this._coins+=a;this._notify()}
  spend(a){if(this._coins<a)return false;this._coins-=a;this._notify();return true}
  checkDailyBonus(){const t=new Date().toDateString();const key=this._k('dailyBonusDate');if(localStorage.getItem(key)!==t){localStorage.setItem(key,t);this.add(50);return true}return false}
}

// =============================================
// SpawnSystem
// =============================================
class SpawnSystem {
  static TABLES=[[{v:2,w:90},{v:4,w:10}],[{v:2,w:80},{v:4,w:20}],[{v:2,w:60},{v:4,w:30},{v:8,w:10}],[{v:2,w:40},{v:4,w:40},{v:8,w:20}],[{v:2,w:10},{v:4,w:50},{v:8,w:30},{v:16,w:10}],[{v:4,w:40},{v:8,w:40},{v:16,w:20}],[{v:4,w:20},{v:8,w:50},{v:16,w:30}],[{v:8,w:60},{v:16,w:40}],[{v:8,w:50},{v:16,w:50}]];
  constructor(u){this.u=u}
  getSpawnValue(){const t=SpawnSystem.TABLES[this.u.getSpawnLevel()]||SpawnSystem.TABLES[0];const tw=t.reduce((s,e)=>s+e.w,0);let r=Math.random()*tw;for(const e of t){r-=e.w;if(r<=0)return e.v}return t[t.length-1].v}
}

// =============================================
// AchievementSystem
// =============================================
class AchievementSystem {
  static BASE={128:20,256:26,512:33,1024:41,2048:50,4096:55,8192:61,16384:67,32768:73};
  constructor(k){this._k=k||(x=>x);this._load();this._listeners=[]}
  _load(){const r=localStorage.getItem(this._k('achievements'));const d={currentGoal:128,pendingClaim:false,collected:[],maxReached:0};this._data=r?{...d,...JSON.parse(r)}:d}
  _save(){localStorage.setItem(this._k('achievements'),JSON.stringify(this._data))}
  onChange(fn){this._listeners.push(fn)}
  _notify(){this._listeners.forEach(fn=>fn(this._data))}
  getReward(t){if(AchievementSystem.BASE[t])return AchievementSystem.BASE[t];let p=32768,r=73;while(p<t){p*=2;r=Math.round(r*1.1)}return r}
  notifyTileReached(v){if(v<=this._data.maxReached)return false;this._data.maxReached=v;if(!this._data.pendingClaim&&v>=this._data.currentGoal){this._data.pendingClaim=true;this._save();this._notify();return true}this._save();return false}
  hasPendingClaim(){return this._data.pendingClaim}
  getCurrentGoal(){return this._data.currentGoal}
  getMaxReached(){return this._data.maxReached}
  getCollected(){return[...this._data.collected]}
  claim(c){if(!this._data.pendingClaim)return 0;const r=this.getReward(this._data.currentGoal);c.add(r);this._data.collected.push(this._data.currentGoal);this._data.pendingClaim=false;this._data.currentGoal*=2;if(this._data.maxReached>=this._data.currentGoal)this._data.pendingClaim=true;this._save();this._notify();return r}
}

// =============================================
// GameBoard
// =============================================
class GameBoard {
  constructor(size,spawn,currency,upgrades,achievements,k){
    this.size=size;this.spawnSystem=spawn;this.currency=currency;this.upgrades=upgrades;this.achievements=achievements;
    this._k=k||(x=>x);
    this.score=0;this.bestScore=parseInt(localStorage.getItem(this._k('bestScore'))||'0',10);
    this.goal=2048;this.mergeCount=0;this.autoDeleteCharge=false;this.secondHeartUsed=false;
    this._prevGrid=null;this._prevScore=0;
    this._listeners={move:[],gameOver:[],win:[],autoCharge:[]};
    this._init();
  }
  on(e,fn){if(this._listeners[e])this._listeners[e].push(fn)}
  _emit(e,d){(this._listeners[e]||[]).forEach(fn=>fn(d))}
  _moveCount=0; // счётчик ходов для сохранения каждые 5
  _init(){
    // Пробуем восстановить сохранённое состояние
    const saved=this._loadGameState();
    // Восстанавливаем если размер поля совпадает (учитываем расширения)
    if(saved&&saved.grid&&saved.grid.length===this.size&&saved.grid[0]?.length===this.size){
      this.grid=saved.grid.map(r=>r.map(v=>v||0));
      this.score=saved.score||0;
      this.goal=saved.goal||2048;
    } else {
      this.grid=Array.from({length:this.size},()=>Array(this.size).fill(0));
      this.score=0;this.goal=2048;
      this._spawnTile();this._spawnTile();
    }
    this._moveCount=0;this.mergeCount=0;this.autoDeleteCharge=false;
    this._prevGrid=null;this._prevScore=0;
  }
  _loadGameState(){
    try{return JSON.parse(localStorage.getItem(this._k('gameState'))||'null')}catch(e){return null}
  }
  _saveGameState(){
    // Сохраняем размер поля вместе с состоянием
    localStorage.setItem(this._k('gameState'),JSON.stringify({
      grid:this.grid,score:this.score,goal:this.goal,size:this.size
    }));
  }
  reset(){
    localStorage.removeItem(this._k('gameState'));
    this.grid=Array.from({length:this.size},()=>Array(this.size).fill(0));
    this.score=0;this.goal=2048;this.mergeCount=0;this.autoDeleteCharge=false;
    this._moveCount=0;this._prevGrid=null;this._prevScore=0;
    this._spawnTile();this._spawnTile();
    this._emit('move',this._state());
  }
  _state(){return{grid:this.grid.map(r=>[...r]),score:this.score,bestScore:this.bestScore,goal:this.goal,size:this.size,autoDeleteCharge:this.autoDeleteCharge}}
  _emptyCell(){const c=[];for(let r=0;r<this.size;r++)for(let cc=0;cc<this.size;cc++)if(this.grid[r][cc]===0)c.push([r,cc]);return c}
  _spawnTile(){const e=this._emptyCell();if(!e.length)return;const[r,c]=e[Math.floor(Math.random()*e.length)];this.grid[r][c]=this.spawnSystem.getSpawnValue()}
  _saveState(){this._prevGrid=this.grid.map(r=>[...r]);this._prevScore=this.score}
  undo(c){if(!this._prevGrid)return false;if(!c.spend(40))return false;this.grid=this._prevGrid.map(r=>[...r]);this.score=this._prevScore;this._prevGrid=null;this._emit('move',this._state());return true}
  move(dir){
    this._saveState();
    const rot=this._rotateToLeft(dir);let moved=false;const merges=[];
    for(let r=0;r<this.size;r++){const res=this._slideLeft(rot[r]);if(res.didMove)moved=true;rot[r]=res.row;merges.push(...res.merges)}
    if(!moved){this._prevGrid=null;return false}
    this.grid=this._rotateFromLeft(dir,rot);
    for(const v of merges){
      this.score+=v;this.currency.awardMerge(v);this.mergeCount++;
      const al=this.upgrades.getAutoDeleteLevel();
      if(al>0){const th=[20,15,10][al-1];if(this.mergeCount%th===0){this.autoDeleteCharge=true;this._emit('autoCharge',true)}}
      this.achievements.notifyTileReached(v);
    }
    if(this.score>this.bestScore){this.bestScore=this.score;localStorage.setItem(this._k('bestScore'),this.bestScore)}
    const maxTile=Math.max(...this.grid.flat());
    if(maxTile>=this.goal){if(this.goal===2048&&!this.upgrades.isSpawnUnlocked())this.upgrades.unlockSpawn();this.goal*=2;this._emit('win',this.goal/2)}
    this._spawnTile();this._emit('move',this._state());
    // Сохраняем состояние каждые 5 ходов
    this._moveCount++;
    if(this._moveCount%5===0)this._saveGameState();
    if(this._isGameOver())this._emit('gameOver',this._state());
    return true;
  }
  _slideLeft(row){
    const f=row.filter(v=>v!==0);const m=[];const merges=[];let i=0;
    while(i<f.length){if(i+1<f.length&&f[i]===f[i+1]){const v=f[i]*2;m.push(v);merges.push(v);i+=2}else{m.push(f[i]);i++}}
    while(m.length<row.length)m.push(0);
    return{row:m,didMove:m.some((v,i)=>v!==row[i]),merges};
  }
  _rotateToLeft(d){const g=this.grid,n=this.size;
    if(d==='left')return g.map(r=>[...r]);
    if(d==='right')return g.map(r=>[...r].reverse());
    if(d==='up')return Array.from({length:n},(_,c)=>Array.from({length:n},(__,r)=>g[r][c]));
    return Array.from({length:n},(_,c)=>Array.from({length:n},(__,r)=>g[n-1-r][c]));
  }
  _rotateFromLeft(d,rot){const n=this.size;
    if(d==='left')return rot.map(r=>[...r]);
    if(d==='right')return rot.map(r=>[...r].reverse());
    if(d==='up')return Array.from({length:n},(_,r)=>Array.from({length:n},(__,c)=>rot[c][r]));
    return Array.from({length:n},(_,r)=>Array.from({length:n},(__,c)=>rot[c][n-1-r]));
  }
  _isGameOver(){
    if(this._emptyCell().length>0)return false;
    for(let r=0;r<this.size;r++)for(let c=0;c<this.size;c++){const v=this.grid[r][c];if(c+1<this.size&&this.grid[r][c+1]===v)return false;if(r+1<this.size&&this.grid[r+1][c]===v)return false}
    return true;
  }
  deleteTile(r,c){if(this.grid[r][c]===0)return false;this.grid[r][c]=0;this._saveGameState();this._emit('move',this._state());return true}
  useAutoDelete(r,c){if(!this.autoDeleteCharge||this.grid[r][c]===0)return false;this.grid[r][c]=0;this.autoDeleteCharge=false;this._saveGameState();this._emit('autoCharge',false);this._emit('move',this._state());return true}
  useSecondHeart(){if(!this.upgrades.hasSecondHeart()||this.secondHeartUsed)return false;this.secondHeartUsed=true;return true}
  getState(){return this._state()}
}

      }

      if(map[e.key]){e.preventDefault();this._handleMove(map[e.key])}
    });
    let ts=null;
    const bEl=document.getElementById('board');
    bEl.addEventListener('touchstart',e=>{ts={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});

      if(!ts)return;const dx=e.changedTouches[0].clientX-ts.x,dy=e.changedTouches[0].clientY-ts.y;ts=null;
      if(Math.abs(dx)<25&&Math.abs(dy)<25)return;
      if(Math.abs(dx)>Math.abs(dy))this._handleMove(dx>0?'right':'left');else this._handleMove(dy>0?'down':'up');
    },{passive:true});

    const bEl=document.getElementById('board');

    bEl.className=`board board-${s.size}`;
    if(wasDel)bEl.classList.add('delete-active');
    bEl.innerHTML='';
    for(let r=0;r<s.size;r++)for(let c=0;c<s.size;c++){
      const v=s.grid[r][c];const el=document.createElement('div');
      el.className=`tile tile-${v||'empty'}`;el.dataset.r=r;el.dataset.c=c;
      if(v)el.textContent=v;
      el.addEventListener('click',()=>{
        if(this.deleteMode&&v)this._confirmDelete(r,c);
        else if(this.deathDeleteMode&&v)this._deathDeleteTile(r,c);
      });
      bEl.appendChild(el);
    }
    document.getElementById('score').textContent=s.score;
    document.getElementById('best').textContent=s.bestScore;
    document.getElementById('goal').textContent=s.goal;
    document.getElementById('grid-size').textContent=`${s.size}×${s.size}`;
    this._updateAutoDeleteBtn(s.autoDeleteCharge);
    if(this.deleteMode||this.deathDeleteMode)this._highlightTiles();
  }
  _renderCoins(c){
    // Деноминация 2: отображаем с точностью до 0.01
    const display=Number.isInteger(c)?c:(Math.round(c*100)/100).toFixed(2).replace(/\.?0+$/,'');
    document.getElementById('coins-count').textContent=display;
    const b=document.getElementById('btn-continue');if(b)b.disabled=c<120
  }
  _updateAutoDeleteBtn(charged){
    const btn=document.getElementById('btn-auto-delete'),badge=document.getElementById('auto-badge');
    const lvl=this.upgrades.getAutoDeleteLevel();
    if(lvl>0){btn.classList.remove('hidden');if(charged){badge.classList.remove('hidden');btn.classList.add('charged')}else{badge.classList.add('hidden');btn.classList.remove('charged')}}
    else btn.classList.add('hidden');
  }
  _switchTab(tab){
    this.activeTab=tab;
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
    document.querySelectorAll('.tab-content').forEach(el=>el.classList.add('hidden'));
    document.getElementById(`tab-${tab}`).classList.remove('hidden');
    if(tab==='upgrades')this._renderUpgrades();
    if(tab==='rewards')this._renderAchievements();
    if(tab==='leaderboard')this._renderLeaderboard('alltime');
    if(tab==='tournament')this._renderTournament('score');
  }
  _enterDeleteMode(){
    this.deleteMode=true;document.getElementById('board').classList.add('delete-active');
    const ov=document.getElementById('overlay-delete');ov.classList.remove('hidden');
    ov.innerHTML=`<div class="delete-banner">✕ Выбери плитку для удаления</div><button class="btn-cancel btn-cancel-delete-trigger">Отмена</button>`;
    ov.querySelector('.btn-cancel-delete-trigger').addEventListener('click',()=>this._exitDeleteMode());
    this._highlightTiles();
  }
  _exitDeleteMode(){
    this.deleteMode=false;document.getElementById('board').classList.remove('delete-active');
    document.getElementById('overlay-delete').classList.add('hidden');this._render(this.board.getState());
  }
  _confirmDelete(r,c){
    if(!this.currency.spend(80)){this.toast('Недостаточно монет');this._exitDeleteMode();return}
    this.board.deleteTile(r,c);this._exitDeleteMode();this.toast('Плитка удалена');
  }
  _highlightTiles(){document.querySelectorAll('.tile:not(.tile-empty)').forEach(el=>el.classList.add('deletable'))}
  _enterAutoDeleteMode(){
    this.deleteMode=true;document.getElementById('board').classList.add('delete-active');
    const ov=document.getElementById('overlay-delete');ov.classList.remove('hidden');
    ov.innerHTML=`<div class="delete-banner">⚡ Авто-удаление: выбери плитку</div><button class="btn-cancel btn-cancel-delete-trigger">Отмена</button>`;
    ov.querySelector('.btn-cancel-delete-trigger').addEventListener('click',()=>this._exitDeleteMode());
    this._highlightTiles();
    document.querySelectorAll('.tile:not(.tile-empty)').forEach(el=>{
      el.onclick=()=>{const r=+el.dataset.r,c=+el.dataset.c;this.board.useAutoDelete(r,c);this._exitDeleteMode();this.toast('Авто-удаление использовано')};
    });
  }
  _showGameOver(s){
    const ov=document.getElementById('overlay-gameover');ov.classList.remove('hidden');
    document.getElementById('overlay-score').textContent=`Счёт: ${s.score}`;
    document.getElementById('overlay-coins').textContent=`Монеты: ${this.currency.coins}`;
    document.getElementById('btn-continue').disabled=this.currency.coins<120;
    const bh=document.getElementById('btn-heart');
    if(this.upgrades.hasSecondHeart()&&!this.board.secondHeartUsed)bh.classList.remove('hidden');else bh.classList.add('hidden');
  }
  _hideGameOver(){document.getElementById('overlay-gameover').classList.add('hidden')}
  _startDeathDelete(){
    if(this.currency.coins<120)return;
    this.currency.spend(120);this.deathDeleteMode=true;this.deathDeleteCount=2;this.deathDeleteRefund=true;
    const ov=document.getElementById('overlay-gameover');ov.style.pointerEvents='none';ov.style.opacity='0.3';
    document.getElementById('board').classList.add('death-select-active');
    document.getElementById('overlay-death-delete').classList.remove('hidden');
    document.getElementById('death-counter').textContent='Осталось: 2';this._highlightTiles();
  }
  _deathDeleteTile(r,c){
    this.board.deleteTile(r,c);this.deathDeleteCount--;
    document.getElementById('death-counter').textContent=`Осталось: ${this.deathDeleteCount}`;
    if(this.deathDeleteCount<=0)this._finishDeathDelete();
  }
  _finishDeathDelete(){
    this.deathDeleteMode=false;this.deathDeleteRefund=false;
    document.getElementById('board').classList.remove('death-select-active');
    document.getElementById('overlay-death-delete').classList.add('hidden');this._hideGameOver();
    const ov=document.getElementById('overlay-gameover');ov.style.pointerEvents='';ov.style.opacity='';
    this._render(this.board.getState());this.toast('Игра продолжается!');
  }
  _cancelDeathDelete(){
    this.deathDeleteMode=false;
    if(this.deathDeleteRefund){this.currency.add(120);this.deathDeleteRefund=false}
    document.getElementById('board').classList.remove('death-select-active');
    document.getElementById('overlay-death-delete').classList.add('hidden');
    const ov=document.getElementById('overlay-gameover');ov.style.pointerEvents='';ov.style.opacity='';
    this._render(this.board.getState());
  }
  _useSecondHeart(){
    if(!this.board.useSecondHeart())return;this._hideGameOver();
    this.deathDeleteMode=true;this.deathDeleteCount=1;this.deathDeleteRefund=false;
    document.getElementById('board').classList.add('death-select-active');
    document.getElementById('overlay-death-delete').classList.remove('hidden');

  _newGame(){
    this._hideGameOver();this.deleteMode=false;this.deathDeleteMode=false;

  _renderShop(){

    const daraiIcon=`<img src="https://i.ibb.co/8gR4k77f/darai.png" style="width:1em;height:1em;border-radius:50%;vertical-align:middle;object-fit:cover;display:inline-block;margin-right:3px">`;

    }).join('');
    el.innerHTML=`<div class="shop">
      <h3 class="section-title">Купить жизни за DARAI</h3>
      <div style="color:var(--text-dim);font-size:0.75rem;padding:4px 0 8px">Токен: darai.tkn.near · 1 жизнь = 100 000 DARAI</div>
      <div class="shop-grid">${rows}</div>
      <div id="shop-status" style="color:#888;font-size:0.8rem;text-align:center;padding:8px 0;min-height:24px"></div>
    </div>`;
    el.querySelectorAll('.btn-buy').forEach(btn=>{
      btn.addEventListener('click',async()=>{

  async _buyLives(lives,priceHuman){
    const statusEl=document.getElementById('shop-status');
    // Защита от двойного нажатия
    if(this._buying){return}
    this._buying=true;

    statusEl.style.color='#888';
    const accountId=localStorage.getItem('nearAccountId');
    if(!accountId){statusEl.textContent='Войди через кошелёк для покупки';this._buying=false;return}
    if(!window._nearConnector){statusEl.textContent='Кошелёк не подключён. Перезайди в аккаунт.';this._buying=false;return}
    if(!window._playerId){statusEl.textContent='Нет данных игрока. Перезайди.';this._buying=false;return}

    statusEl.textContent='Открываем кошелёк...';
    let txHash=null;
    try{
      // Таймаут на получение wallet — 15 сек
      const walletPromise=window._nearConnector.wallet();
      const timeoutPromise=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),15000));
      const wallet=await Promise.race([walletPromise,timeoutPromise]);

      const amount=(BigInt(priceHuman)*BigInt('1'+'0'.repeat(18))).toString();
      const result=await wallet.signAndSendTransaction({
        receiverId:DARAI_TOKEN,
        actions:[
          {type:'FunctionCall',params:{methodName:'storage_deposit',args:{account_id:'2048game.near',registration_only:true},gas:'10000000000000',deposit:'1250000000000000000000'}},
          {type:'FunctionCall',params:{methodName:'ft_transfer',args:{receiver_id:'2048game.near',amount,memo:`buy_lives_${lives}`},gas:'20000000000000',deposit:'1'}}
        ]
      });
      txHash=result?.transaction?.hash||result?.transaction_outcome?.id||null;
      if(!txHash){statusEl.textContent='Транзакция отправлена, но хэш не получен.';this._buying=false;return}
    }catch(e){
      if(e.message==='timeout'){
        statusEl.textContent='Кошелёк не ответил. Попробуй ещё раз.';
      } else {
        statusEl.textContent='Транзакция отменена.';
      }
      console.error('tx error',e);
      this._buying=false;
      return;
    }

    statusEl.textContent='Проверяем транзакцию...';
    try{
      const used=await db.isTxUsed(txHash);
      if(used){statusEl.textContent='Эта транзакция уже была использована.';this._buying=false;return}
      const verified=await this._verifyTx(txHash,accountId,priceHuman);
      if(!verified){statusEl.textContent='Транзакция не прошла проверку. Обратись в поддержку.';this._buying=false;return}
      const amount=(BigInt(priceHuman)*BigInt('1'+'0'.repeat(18))).toString();
      await db.recordPurchase(window._playerId,accountId,txHash,lives,amount);
      LivesSystem.addBought(lives);
      renderLivesUI();
      if(window._syncToDB)window._syncToDB();
      statusEl.style.color='#4caf50';
      statusEl.textContent=`✓ +${lives} ❤️ успешно куплено!`;
    }catch(e){
      statusEl.textContent='Ошибка верификации. Жизни не начислены.';
      console.error('verify error',e);
    }
    this._buying=false;
  }

  async _verifyTx(txHash,senderAccountId,expectedAmountHuman){
    try{
      // Ждём немного — транзакция может ещё не проиндексироваться
      await new Promise(r=>setTimeout(r,2000));

      const url='https://api.sendler.xyz/history/ft-transfers/?wallet_id=2048game.near&direction=in&symbol=darai.tkn.near&limit=50';
      const resp=await fetch(url,{
        headers:{
          'accept':'application/json',
          'X-API-Key':'j9mwYHIkRsmhM7dOoJy9yBSEdSZSWtBw02BOIGy3jzk'
        }
      });
      if(!resp.ok)return true; // API недоступен — доверяем

      const data=await resp.json();
      const items=data.items||[];

      // Ищем транзакцию по хэшу
      const tx=items.find(t=>t.tx_hash===txHash);
      if(!tx)return true; // не нашли — возможно ещё не проиндексировалась, доверяем

      // Проверяем отправителя
      if(tx.sender_id!==senderAccountId)return false;

      // Проверяем получателя
      if(tx.receiver_id!=='2048game.near')return false;

      // Проверяем сумму (amount в yocto = expectedAmountHuman * 10^18)
      const expectedAmount=(BigInt(expectedAmountHuman)*BigInt('1'+'0'.repeat(18))).toString();
      if(tx.amount!==expectedAmount)return false;

      return true;

function getWeekStart(){const n=new Date(),d=n.getDay(),diff=d===0?-6:1-d,m=new Date(n);m.setDate(n.getDate()+diff);return m.toISOString().split('T')[0]}

class DB {
  constructor(){this._ready=false;this._client=null;this._load()}
  async _load(){
    await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});
    this._client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    this._ready=true;
  }
  async _wait(){if(this._ready)return;await new Promise(r=>{const t=setInterval(()=>{if(this._ready){clearInterval(t);r()}},50)})}
  async getOrCreatePlayer(accountId){
    await this._wait();
    const{data:ex}=await this._client.from('players').select('*').eq('nickname',accountId).maybeSingle();
    if(ex){await this._client.from('players').update({last_seen_at:new Date().toISOString()}).eq('id',ex.id);return ex}
    const{data:cr,error}=await this._client.from('players').insert({nickname:accountId}).select().single();
    if(error)throw error;return cr;
  }
  async savePlayer(id,{coins,bestScore,maxTile,upgrades,achievements,lives,livesResetDate,livesBought,gameState}){
    await this._wait();
    const upd={coins,best_score:bestScore,max_tile:maxTile,upgrades,achievements,last_seen_at:new Date().toISOString()};
    if(typeof lives==='number')upd.lives=lives;
    if(livesResetDate!==undefined)upd.lives_reset_date=livesResetDate;
    if(typeof livesBought==='number')upd.lives_bought=livesBought;
    if(gameState!==undefined)upd.game_state=gameState;
    await this._client.from('players').update(upd).eq('id',id);
  }
  async submitScore(playerId,nickname,score,maxTile){
    await this._wait();
    const{data:at}=await this._client.from('leaderboard_alltime').select('best_score').eq('player_id',playerId).maybeSingle();
    if(!at||score>at.best_score)await this._client.from('leaderboard_alltime').upsert({player_id:playerId,nickname,best_score:score,max_tile:maxTile,updated_at:new Date().toISOString()},{onConflict:'player_id'});
    const ws=getWeekStart();
    const{data:wk}=await this._client.from('leaderboard_weekly').select('best_score').eq('player_id',playerId).eq('week_start',ws).maybeSingle();
    if(!wk||score>wk.best_score)await this._client.from('leaderboard_weekly').upsert({player_id:playerId,nickname,best_score:score,max_tile:maxTile,week_start:ws,updated_at:new Date().toISOString()},{onConflict:'player_id, week_start'});
  }
  async getAlltimeLeaderboard(limit=50){
    await this._wait();
    const{data}=await this._client.from('leaderboard_alltime').select('nickname,best_score,max_tile').order('best_score',{ascending:false}).limit(limit);
    return data||[];
  }
  async getWeeklyLeaderboard(limit=50){
    await this._wait();
    const{data}=await this._client.from('leaderboard_weekly').select('nickname,best_score,max_tile').eq('week_start',getWeekStart()).order('best_score',{ascending:false}).limit(limit);
    return data||[];
  }

  async getLivesTournament(limit=50){
    await this._wait();
    const{data}=await this._client.from('tournament_lives').select('nickname,games_played').eq('week_start',getWeekStart()).order('games_played',{ascending:false}).limit(limit);
    return data||[];
  }

  async incrementGamesPlayed(playerId,nickname){
    await this._wait();
    const ws=getWeekStart();
    const{data:ex}=await this._client.from('tournament_lives').select('games_played').eq('player_id',playerId).eq('week_start',ws).maybeSingle();
    const games=(ex?.games_played||0)+1;
    await this._client.from('tournament_lives').upsert({player_id:playerId,nickname,games_played:games,week_start:ws,updated_at:new Date().toISOString()},{onConflict:'player_id, week_start'});
  }

  async getTournamentRewards(type){
    await this._wait();
    const{data}=await this._client.from('tournament_rewards').select('place,coins_reward').eq('tournament_type',type).order('place',{ascending:true});
    return data||[];
  }

  async deleteTournamentRewards(type){
    await this._wait();
    await this._client.from('tournament_rewards').delete().eq('tournament_type',type);
  }

  async setTournamentReward(type,place,coins){
    await this._wait();
    await this._client.from('tournament_rewards').upsert({tournament_type:type,place,coins_reward:coins},{onConflict:'tournament_type, place'});
  }

  async getNotifications(playerId){
    await this._wait();
    const{data}=await this._client.from('tournament_notifications').select('*').eq('player_id',playerId).eq('seen',false).order('created_at',{ascending:false});
    return data||[];
  }

  async markNotificationSeen(id){
    await this._wait();
    await this._client.from('tournament_notifications').update({seen:true}).eq('id',id);
  }

  async finishTournament(type){
    await this._wait();
    let topRows=[];
    if(type==='score'){
      const{data}=await this._client.from('leaderboard_weekly').select('player_id,nickname,best_score').gt('best_score',0).order('best_score',{ascending:false}).limit(10);
      topRows=data||[];
    } else {
      const{data}=await this._client.from('tournament_lives').select('player_id,nickname,games_played').gt('games_played',0).order('games_played',{ascending:false}).limit(10);
      topRows=data||[];
    }
    const rewards=await this.getTournamentRewards(type);
    let awarded=0;
    for(let i=0;i<topRows.length;i++){
      const rw=rewards.find(r=>r.place===i+1);
      if(!rw||rw.coins_reward<=0)continue;
      const row=topRows[i];
      // Проверяем что уведомление ещё не было создано (защита от двойного начисления)
      const{data:existing}=await this._client.from('tournament_notifications')
        .select('id').eq('player_id',row.player_id)
        .ilike('message',`%Турнир завершён%${i+1} место%`)
        .gte('created_at',new Date(Date.now()-3600000).toISOString()) // за последний час
        .maybeSingle();
      if(existing)continue; // уже начислено
      const{data:p}=await this._client.from('players').select('coins').eq('id',row.player_id).single();
      if(p)await this._client.from('players').update({coins:(p.coins||0)+rw.coins_reward}).eq('id',row.player_id);
      await this._client.from('tournament_notifications').insert({
        player_id:row.player_id,
        message:`🏆 Турнир завершён! Ты занял ${i+1} место и получил +${rw.coins_reward} монет!`,
        coins_awarded:rw.coins_reward
      });
      awarded++;
    }
    // Сброс: обнуляем значения всех участников
    if(type==='score'){
      await this._client.from('leaderboard_weekly').update({best_score:0,max_tile:0}).gt('best_score',0);
    } else {
      await this._client.from('tournament_lives').update({games_played:0}).gt('games_played',0);
    }
    return awarded;
  }

  // Проверить что tx_hash ещё не использован
  async isTxUsed(txHash){
    await this._wait();
    const{data}=await this._client.from('purchases').select('id').eq('tx_hash',txHash).maybeSingle();
    return!!data;
  }

  // Записать покупку (UNIQUE на tx_hash защищает от дублей)
  async recordPurchase(playerId,accountId,txHash,livesBought,amountDarai){
    await this._wait();
    const{error}=await this._client.from('purchases').insert({
      player_id:playerId,account_id:accountId,
      tx_hash:txHash,lives_bought:livesBought,
      amount_darai:amountDarai,status:'confirmed'
    });
    if(error)throw error;
  }
}

const db=new DB();

// =============================================
// Lives System — привязан к accountId, синхронизируется с БД
// =============================================
const LIVES_MAX=5;
const LIVES_TZ_OFFSET=4; // Тбилиси UTC+4
const DARAI_TOKEN='darai.tkn.near';
const DARAI_DECIMALS=18;
// Цена 1 жизни = 100 000 DARAI (в наименьших единицах = 100000 * 10^18)
const DARAI_PER_LIFE=BigInt('100000'+'0'.repeat(18));

// Пакеты: [количество жизней, скидка %]
const LIFE_PACKS=[
  {lives:1, discount:0},
  {lives:2, discount:2},
  {lives:3, discount:4},
  {lives:5, discount:6},
  {lives:7, discount:8},
  {lives:10,discount:10},
];

function daraiPrice(lives,discountPct){
  // Цена в DARAI (человекочитаемая, без decimals)
  const base=100000*lives;
  return Math.floor(base*(1-discountPct/100));
}

function lsKey(key,accountId){return accountId?key+'__'+accountId:key}

const LivesSystem={
  _accountId:null,
  _dbLoaded:false, // флаг: данные загружены из БД, не трогать checkReset
  init(accountId){this._accountId=accountId;this._dbLoaded=false},
  _get(){
    const d=JSON.parse(localStorage.getItem(lsKey('lives',this._accountId))||'null');
    if(!d)return{count:LIVES_MAX,bought:0,lastReset:this._todayKey()};
    if(d.bought===undefined)d.bought=0;
    return d;
  },
  _save(d){localStorage.setItem(lsKey('lives',this._accountId),JSON.stringify(d))},
  _todayKey(){
    const now=new Date();
    const tbNow=new Date(now.getTime()+LIVES_TZ_OFFSET*3600000);
    return tbNow.toISOString().slice(0,10);
  },
  nextResetMs(){
    const now=new Date();
    const tbNow=new Date(now.getTime()+LIVES_TZ_OFFSET*3600000);
    const tbMidnight=new Date(tbNow);
    tbMidnight.setUTCHours(0,0,0,0);
    tbMidnight.setUTCDate(tbMidnight.getUTCDate()+1);
    return tbMidnight.getTime()-LIVES_TZ_OFFSET*3600000;
  },
  checkReset(){
    // Если данные только что загружены из БД — не трогаем
    if(this._dbLoaded)return false;
    const d=this._get();
    const today=this._todayKey();
    if(d.lastReset!==today){
      const bought=d.bought||0;
      d.count=LIVES_MAX+bought;
      d.lastReset=today;
      this._save(d);
      return true;
    }
    return false;
  },
  getCount(){this.checkReset();return this._get().count},
  spend(){
    const d=this._get();
    if(d.count<=0)return false;
    if(d.bought>0&&d.count>LIVES_MAX)d.bought--;
    d.count--;
    this._save(d);
    return true;
  },
  addBought(n){
    const d=this._get();
    d.count+=n;
    d.bought=(d.bought||0)+n;
    this._save(d);
  },
  // БД — единственный источник истины для жизней
  // Просто записываем данные из БД как есть, без локальной логики
  loadFromDB(lives,livesResetDate,bought){
    const today=this._todayKey();
    const dbDate=livesResetDate||'';
    let count=typeof lives==='number'?lives:LIVES_MAX;
    let boughtCount=typeof bought==='number'?bought:0;

    // Если в БД дата другая (новый день) — восстанавливаем бесплатные жизни
    // но купленные сохраняем
    if(dbDate!==today){
      count=LIVES_MAX+boughtCount;
    }

    const d={count,bought:boughtCount,lastReset:today};
    this._save(d);
    this._dbLoaded=true; // помечаем что данные из БД, checkReset не трогает
  },
  formatCountdown(){
    const ms=this.nextResetMs()-Date.now();
    if(ms<=0)return'00:00:00';
    const h=Math.floor(ms/3600000);
    const m=Math.floor((ms%3600000)/60000);
    const s=Math.floor((ms%60000)/1000);
    return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
};

// =============================================
// NEAR Wallet Login (HOT Connector — near-connect.bundle.js)
// =============================================

// Коннектор создаётся СРАЗУ при загрузке — не лениво
// Это ускоряет открытие модала и восстанавливает сессию
let _connector=null;
function getConnector(){
  if(_connector)return _connector;
  const lib=window.NearConnectLib;
  if(!lib||!lib.NearConnector)return null;
  try{
    _connector=new lib.NearConnector({
      network:'mainnet',
      footerBranding:null,
      walletConnect:{
        projectId:'1292473190ce7eb75c9de67e15aaad99',
        metadata:{
          name:'2048+',
          description:'2048+ Game',
          url:window.location.origin||'https://2048.vercel.app',
          icons:[]
        }
      }
    });
    // Сохраняем глобально сразу
    window._nearConnector=_connector;
  }catch(e){console.error('NearConnector init error',e)}
  return _connector;
}

// Инициализируем коннектор сразу при загрузке страницы
// чтобы модал открывался быстро и сессия восстанавливалась
const _earlyConnector=getConnector();

function showWalletScreen(){
  return new Promise((resolve)=>{
    const overlay=document.createElement('div');
    overlay.id='wallet-overlay';
    overlay.style.cssText='position:fixed;inset:0;background:#1a1a2e;display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:20px;padding:24px';
    overlay.innerHTML=`
      <div style="font-size:2.8rem;font-weight:900;color:#fff;letter-spacing:-1px">2048<span style="color:#e94560">+</span></div>
      <div style="color:#aaa;font-size:0.95rem;text-align:center;max-width:280px;line-height:1.5">Подключи HOT / NEAR кошелёк для сохранения прогресса и участия в турнирах</div>
      <button id="btn-connect-wallet" style="background:#e94560;color:#fff;border:none;border-radius:10px;padding:14px 32px;font-size:1rem;font-weight:700;cursor:pointer;width:100%;max-width:300px">
        🔗 Подключить кошелёк
      </button>
      <div style="color:#555;font-size:0.75rem;text-align:center;max-width:260px">HOT Wallet · Meteor · MyNearWallet · Nightly · и другие</div>
      <button id="btn-skip-wallet" style="background:transparent;color:#555;border:1px solid #333;border-radius:10px;padding:10px 24px;font-size:0.85rem;cursor:pointer;width:100%;max-width:300px">
        Играть без входа
      </button>
      <div id="wallet-status" style="color:#888;font-size:0.8rem;min-height:20px;text-align:center"></div>`;
    document.body.appendChild(overlay);
    const statusEl=document.getElementById('wallet-status');

    const connector=getConnector();
    if(!connector){
      statusEl.textContent='Ошибка загрузки SDK. Обнови страницу.';
      document.getElementById('btn-connect-wallet').disabled=true;
      document.getElementById('btn-skip-wallet').addEventListener('click',()=>{overlay.remove();resolve(null)});
      return;
    }

    // Слушаем signIn ОДИН РАЗ — {once:true} предотвращает накопление обработчиков
    const onSignIn=(t)=>{
      const accountId=t.accounts[0].accountId;
      window._nearConnector=connector;
      statusEl.textContent='✓ '+accountId;
      setTimeout(()=>{overlay.remove();resolve(accountId)},600);
    };
    connector.on('wallet:signIn',onSignIn);

    document.getElementById('btn-connect-wallet').addEventListener('click',()=>{
      statusEl.textContent='Открываем выбор кошелька...';
      // НЕ await — connect() только открывает модал, результат через событие
      connector.connect().catch(()=>{});
    });

    document.getElementById('btn-skip-wallet').addEventListener('click',()=>{
      connector.off&&connector.off('wallet:signIn',onSignIn);
      overlay.remove();resolve(null);
    });
  });
}

// =============================================
// Восстановить прогресс из БД в localStorage (per-account)
// =============================================
function applyPlayerData(player,accountId){
  const k=(key)=>lsKey(key,accountId);

  const localCoins=parseInt(localStorage.getItem(k('coins'))||'0');
  if((player.coins||0)>localCoins)localStorage.setItem(k('coins'),player.coins);

  const localBest=parseInt(localStorage.getItem(k('bestScore'))||'0');
  if((player.best_score||0)>localBest)localStorage.setItem(k('bestScore'),player.best_score);

  if(player.upgrades&&Object.keys(player.upgrades).length>0)
    localStorage.setItem(k('upgrades'),JSON.stringify(player.upgrades));

  if(player.achievements&&Object.keys(player.achievements).length>0){
    const localAch=JSON.parse(localStorage.getItem(k('achievements'))||'{}');
    const merged={...localAch,...player.achievements};
    if((player.achievements.maxReached||0)>(localAch.maxReached||0))
      merged.maxReached=player.achievements.maxReached;
    localStorage.setItem(k('achievements'),JSON.stringify(merged));
  }

  // Состояние поля — восстанавливаем из БД
  if(player.game_state&&player.game_state.grid){
    localStorage.setItem(k('gameState'),JSON.stringify(player.game_state));
  }

  // Жизни — загружаем из БД (передаём bought из БД)
  LivesSystem.loadFromDB(player.lives, player.lives_reset_date, player.lives_bought||0);
}

// =============================================
// Lives UI
// =============================================
function renderLivesUI(){
  const old=document.getElementById('lives-bar');
  if(old)old.remove();

  const count=LivesSystem.getCount();
  const bar=document.createElement('div');
  bar.id='lives-bar';
  bar.style.cssText='display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 0 2px';

  if(count>0){
    bar.innerHTML=`<span style="font-size:1.4rem">❤️</span><span style="font-size:1.1rem;font-weight:700;color:#fff">${count}</span>`;
  } else {
    bar.innerHTML=`<span style="font-size:1.1rem">❤️</span><span style="color:#e94560;font-size:0.85rem;font-weight:700">0 — сброс через <span id="lives-countdown"></span></span>`;
    const tick=()=>{const el=document.getElementById('lives-countdown');if(el)el.textContent=LivesSystem.formatCountdown()};
    tick();
    const timer=setInterval(()=>{
      if(LivesSystem.checkReset()){clearInterval(timer);renderLivesUI();return}
      tick();
    },1000);
  }

  const app=document.getElementById('app');
  const header=app.querySelector('.header');
  if(header&&header.nextSibling)app.insertBefore(bar,header.nextSibling);
  else app.prepend(bar);
}

// =============================================
// Init
// =============================================
async function init(){
  let accountId=localStorage.getItem('nearAccountId');

  if(!accountId){
    const result=await showWalletScreen();
    if(result){
      accountId=result;
      localStorage.setItem('nearAccountId',accountId);
    }
  }

  let playerId=null;
  let playerNickname=accountId||('guest_'+Math.random().toString(36).slice(2,8));

  // Инициализируем LivesSystem с accountId ДО загрузки данных
  LivesSystem.init(accountId);

  if(accountId){
    try{
      const player=await db.getOrCreatePlayer(accountId);
      playerId=player.id;
      window._playerId=player.id; // глобально для магазина
      playerNickname=player.nickname;
      applyPlayerData(player,accountId);
    }catch(e){console.warn('DB unavailable, playing offline')}
  }

  // Все localStorage ключи привязаны к аккаунту
  const k=(key)=>lsKey(key,accountId);

  const upgrades=new UpgradeSystem(k);
  const currency=new CurrencyManager(upgrades,k);
  const spawn=new SpawnSystem(upgrades);
  const achievements=new AchievementSystem(k);
  const board=new GameBoard(upgrades.getGridSize(),spawn,currency,upgrades,achievements,k);
  const ui=new UI(board,currency,upgrades,achievements);

  // Отрисовываем жизни
  renderLivesUI();

  if(currency.checkDailyBonus())ui.toast('🎁 Ежедневный бонус: +50 монет!');
  if(accountId)ui.toast(`👋 Подключён: ${accountId}`);

  // Показываем уведомления о наградах турнира (монеты уже начислены в БД при finishTournament)
  if(playerId){
    db.getNotifications(playerId).then(async(notes)=>{
      for(const n of notes){
        ui.toast(n.message);
        await db.markNotificationSeen(n.id);
      }
    }).catch(()=>{});
  }

  const syncToDB=()=>{
    if(!playerId)return;
    const livesData=LivesSystem._get();
    const gs=JSON.parse(localStorage.getItem(k('gameState'))||'null');
    db.savePlayer(playerId,{
      coins:currency.coins,
      bestScore:parseInt(localStorage.getItem(k('bestScore'))||'0'),
      maxTile:achievements.getMaxReached(),
      upgrades:JSON.parse(localStorage.getItem(k('upgrades'))||'{}'),
      achievements:JSON.parse(localStorage.getItem(k('achievements'))||'{}'),
      lives:livesData.count,
      livesResetDate:livesData.lastReset||'',
      livesBought:livesData.bought||0,
      gameState:gs,
    });
  };

  // Жизнь тратится только при явном старте новой игры (кнопка в game over)
  const origReset=board.reset.bind(board);
  board.reset=()=>{
    if(LivesSystem.getCount()<=0){ui.toast('❤️ Нет жизней! Жди сброса.');return}
    LivesSystem.spend();
    renderLivesUI();
    syncToDB();
    // Считаем игру в турнире по играм
    if(playerId)db.incrementGamesPlayed(playerId,playerNickname).catch(()=>{});
    origReset();
  };

  // Синхронизация при покупке апгрейда
  const origSave=upgrades._save.bind(upgrades);
  upgrades._save=()=>{origSave();syncToDB()};

  // Синхронизация при изменении монет (покупка, награда за слияние)
  currency.onChange(()=>syncToDB());

  // Синхронизация при получении достижения
  achievements.onChange(()=>syncToDB());

  // Синхронизация при трате жизни
  const origSpend=LivesSystem.spend.bind(LivesSystem);
  LivesSystem.spend=()=>{const r=origSpend();if(r)syncToDB();return r};

  // Синхронизация при новом рекорде (каждый ход)
  board.on('move',(state)=>{
    if(state.score>0&&state.score===state.bestScore)syncToDB();
  });

  board.on('gameOver',async(state)=>{
    localStorage.removeItem(k('gameState'));
    if(playerId){
      const maxTile=Math.max(...state.grid.flat());
      const livesData=LivesSystem._get();
      db.savePlayer(playerId,{
        coins:currency.coins,bestScore:state.bestScore,maxTile,
        upgrades:JSON.parse(localStorage.getItem(k('upgrades'))||'{}'),
        achievements:JSON.parse(localStorage.getItem(k('achievements'))||'{}'),
        lives:livesData.count,livesResetDate:livesData.lastReset||'',
        livesBought:livesData.bought||0,
        gameState:null,
      });
      db.submitScore(playerId,playerNickname,state.score,maxTile);
    }
  });

  // Резервная синхронизация каждые 15 сек
  setInterval(syncToDB,15000);
  // Делаем syncToDB доступным глобально (для магазина)
  window._syncToDB=syncToDB;

  // Синхронизация при закрытии/уходе со страницы
  window.addEventListener('beforeunload',()=>syncToDB());

  // Кнопка выхода в шапке
  if(accountId){
    const coinsEl=document.querySelector('.coins-display');
    if(coinsEl){
      const btn=document.createElement('button');
      btn.title=`${accountId} — выйти`;
      btn.style.cssText='background:none;border:none;color:#666;cursor:pointer;font-size:0.8rem;padding:0 2px;margin-left:4px';
      btn.textContent='⏏';
      btn.addEventListener('click',()=>{
        if(!confirm(`Выйти из ${accountId}?`))return;
        localStorage.removeItem('nearAccountId');
        location.reload();
      });
      coinsEl.appendChild(btn);
    }
  }
}

init();
</script>
